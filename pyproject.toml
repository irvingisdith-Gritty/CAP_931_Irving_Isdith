[project]
name = "cap-931-irving-isdith"
version = "0.1.0"
description = "AI-powered B2B Sales Intelligence Assistant using Streamlit, Groq, and automated website research"
readme = "README.md"
authors = [
    { name = "irvingisdith-Gritty", email = "irving.isdith@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "streamlit>=1.65.0,<2.0.0",
    "groq>=1.7.0,<2.0.0",
    "requests>=2.34.2,<3.0.0",
    "beautifulsoup4>=4.15.0,<5.0.0",
    "pymupdf>=2.0",
    "python-docx>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
